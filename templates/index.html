<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Quina Inteligente</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>🎯 Gerador Quina Inteligente</h1>
    <p class="subtitulo">Gere jogos da Quina com estratégia ou aleatoriamente</p>

    <div class="card controles">
        <label for="qtd">Quantidade de jogos:</label>
        <input type="number" id="qtd" value="5" min="1" max="20">

        <div class="botoes">
            <button class="btn-normal" onclick="gerar('normal')">🎲 Modo Normal</button>
            <button class="btn-ia" onclick="gerar('ia')">🧠 Modo IA</button>
        </div>

        <div class="modo-label" id="modoAtual">Modo atual: —</div>
    </div>

    <div id="resultado"></div>

    <div class="card historico-section" id="historicoSection" style="display:none;">
        <div class="historico-header">
            <h2>📋 Histórico de Jogos</h2>
            <button class="btn-limpar" onclick="limparHistorico()">🗑️ Limpar</button>
        </div>
        <div id="historicoLista"></div>
    </div>
</div>

<script>
async function gerar(modo) {
    const qtd = document.getElementById("qtd").value;

    document.getElementById("modoAtual").innerText =
        "Modo atual: " + (modo === "ia" ? "Inteligente 🧠" : "Normal 🎲");

    const res = await fetch("/gerar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quantidade: qtd, modo: modo })
    });

    const jogos = await res.json();
    renderJogos(jogos, modo);
    atualizarHistorico();
}

function renderJogos(jogos, modo) {
    const div = document.getElementById("resultado");
    div.innerHTML = `<h2>Jogos gerados (${modo === "ia" ? "IA 🧠" : "Normal 🎲"})</h2>`;

    jogos.forEach((jogo, i) => {
        let html = `<div class="jogo"><span class="jogo-num">Jogo ${i + 1}</span><div class="bolinhas">`;
        jogo.forEach(num => {
            html += `<span class="bolinha">${num}</span>`;
        });
        html += `</div></div>`;
        div.innerHTML += html;
    });
}

async function atualizarHistorico() {
    const res = await fetch("/historico");
    const historico = await res.json();

    const section = document.getElementById("historicoSection");
    const lista = document.getElementById("historicoLista");

    if (historico.length === 0) {
        section.style.display = "none";
        return;
    }

    section.style.display = "block";
    lista.innerHTML = `<p class="historico-total">Total acumulado: <strong>${historico.length} jogos</strong></p>`;

    historico.slice(-10).reverse().forEach((jogo, i) => {
        let html = `<div class="jogo jogo-historico"><span class="jogo-num">#${historico.length - i}</span><div class="bolinhas">`;
        jogo.forEach(num => {
            html += `<span class="bolinha bolinha-sm">${num}</span>`;
        });
        html += `</div></div>`;
        lista.innerHTML += html;
    });
}

async function limparHistorico() {
    await fetch("/historico", { method: "DELETE" });
    document.getElementById("historicoSection").style.display = "none";
    document.getElementById("historicoLista").innerHTML = "";
}

atualizarHistorico();
</script>

</body>
</html>

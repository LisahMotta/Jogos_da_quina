<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Quina Inteligente</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quina IA">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">

    <!-- Estilo -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>🎯 Gerador Quina Inteligente</h1>
    <p class="subtitulo">Gere jogos da Quina com estratégia ou aleatoriamente</p>

    <!-- Banner de instalação PWA -->
    <div id="installBanner" class="install-banner" style="display:none;">
        <span>📲 Instale o app no seu dispositivo!</span>
        <button id="installBtn" class="btn-install">Instalar</button>
        <button id="dismissBtn" class="btn-dismiss">✕</button>
    </div>

    <div class="card controles">
        <label for="qtd">Quantidade de jogos:</label>
        <input type="number" id="qtd" value="5" min="1" max="20">

        <div class="botoes">
            <button class="btn-normal" onclick="gerar('normal')">🎲 Modo Normal</button>
            <button class="btn-ia" onclick="gerar('ia')">🧠 Modo IA</button>
        </div>

        <div class="modo-label" id="modoAtual">Modo atual: —</div>
    </div>

    <div id="resultado"></div>

    <div class="card historico-section" id="historicoSection" style="display:none;">
        <div class="historico-header">
            <h2>📋 Histórico de Jogos</h2>
            <button class="btn-limpar" onclick="limparHistorico()">🗑️ Limpar</button>
        </div>
        <div id="historicoLista"></div>
    </div>
</div>

<script>
// ── PWA: Service Worker ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registrado:', reg.scope))
        .catch(err => console.warn('SW falhou:', err));
}

// ── PWA: Banner de instalação ────────────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').style.display = 'flex';
});

document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').style.display = 'none';
});

document.getElementById('dismissBtn').addEventListener('click', () => {
    document.getElementById('installBanner').style.display = 'none';
});

// ── App ──────────────────────────────────────────────────────────
async function gerar(modo) {
    const qtd = document.getElementById("qtd").value;

    document.getElementById("modoAtual").innerText =
        "Modo atual: " + (modo === "ia" ? "Inteligente 🧠" : "Normal 🎲");

    try {
        const res = await fetch("/gerar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ quantidade: qtd, modo: modo })
        });

        const data = await res.json();

        if (!res.ok || data.erro) {
            document.getElementById("resultado").innerHTML =
                `<p class="erro">Erro ao gerar jogos: ${data.erro || res.statusText}</p>`;
            return;
        }

        renderJogos(data, modo);
        atualizarHistorico();
    } catch (e) {
        document.getElementById("resultado").innerHTML =
            `<p class="erro">Sem conexão com o servidor.</p>`;
    }
}

function renderJogos(jogos, modo) {
    const div = document.getElementById("resultado");
    div.innerHTML = `<h2>Jogos gerados (${modo === "ia" ? "IA 🧠" : "Normal 🎲"})</h2>`;

    jogos.forEach((jogo, i) => {
        let html = `<div class="jogo"><span class="jogo-num">Jogo ${i + 1}</span><div class="bolinhas">`;
        jogo.forEach(num => {
            html += `<span class="bolinha">${num}</span>`;
        });
        html += `</div></div>`;
        div.innerHTML += html;
    });
}

async function atualizarHistorico() {
    try {
        const res = await fetch("/historico");
        const historico = await res.json();

        const section = document.getElementById("historicoSection");
        const lista = document.getElementById("historicoLista");

        if (!historico.length) {
            section.style.display = "none";
            return;
        }

        section.style.display = "block";
        lista.innerHTML = `<p class="historico-total">Total acumulado: <strong>${historico.length} jogos</strong></p>`;

        historico.slice(0, 10).forEach((jogo, i) => {
            let html = `<div class="jogo jogo-historico"><span class="jogo-num">#${i + 1}</span><div class="bolinhas">`;
            jogo.forEach(num => {
                html += `<span class="bolinha bolinha-sm">${num}</span>`;
            });
            html += `</div></div>`;
            lista.innerHTML += html;
        });
    } catch (e) {
        // offline — silencioso
    }
}

async function limparHistorico() {
    await fetch("/historico", { method: "DELETE" });
    document.getElementById("historicoSection").style.display = "none";
    document.getElementById("historicoLista").innerHTML = "";
}

atualizarHistorico();
</script>

</body>
</html>
